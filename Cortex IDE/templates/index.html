<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex IDE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.js"></script> <!-- New -->
</head>
<body>
    <h1>Cortex IDE</h1>

    <form id="project-form" class="input-form">
        <input type="text" id="project-name-input" placeholder="Enter new project name..." required autocomplete="off">
        <button type="submit">Start New Project</button>
    </form>
    
    <form id="chat-form" class="input-form" style="display: none;">
        <input type="text" id="chat-input" placeholder="Send a message to the agent..." required autocomplete="off">
        <div id="chat-button-container">
            <div id="agent-spinner" class="spinner" style="display: none;"></div>
            <button type="submit" id="chat-send-btn">Send</button>
        </div>
    </form>

    <div id="app-container">
        <div id="file-tree-panel" class="panel">
            <div class="panel-header">
                <span>Project Files</span>
                <div class="header-icons">
                    <button id="add-file-btn" class="icon-btn" title="New File">+ File</button>
                    <button id="add-folder-btn" class="icon-btn" title="New Folder">+ Folder</button>
                    <button id="download-project-btn" title="Download Project as .zip" style="display: none;">↓</button>
                </div>
            </div>
            <div class="panel-content">
                <form id="create-item-form" style="display: none;">
                    <input id="new-item-input" type="text" required autocomplete="off">
                </form>
                <button id="install-deps-btn" class="action-button" title="Install packages from requirements.txt">Install Dependencies</button>
                <ul id="file-tree-list"><li>Create a project to see files.</li></ul>
            </div>
        </div>
        <div id="main-panel" class="panel">
            <div class="panel-header">Agent Logs</div>
            <div class="panel-content" id="log-content">
                Welcome! Enter a project name above to begin.
            </div>
        </div>
        <div id="file-viewer-panel" class="panel">
            <div class="panel-header">
                <span id="file-viewer-header">File Viewer</span>
                <div>
                    <button id="run-code-btn">Run</button>
                    <button id="save-file-btn">Save</button>
                        <button id="format-code-btn" title="Format Python code using Black">Format</button>
                </div>
            </div>
            <div class="panel-content editor-container">
                <textarea id="editor-textarea" spellcheck="false"></textarea>
                <pre id="terminal-output" class="terminal-output" style="display: none;"></pre>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <p id="modal-text">Are you sure?</p>
            <div class="modal-buttons">
                <button id="modal-confirm-btn" class="modal-btn modal-btn-danger">Delete</button>
                <button id="modal-cancel-btn" class="modal-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="{{ url_for('static', filename='js/package_installer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/python_linter_addon.js') }}"></script>
    <script src="{{ url_for('static', filename='js/code_formatter_addon.js') }}"></script>
    <script src="{{ url_for('static', filename='js/autocomplete_addon.js') }}"></script>
</body>
</html>
